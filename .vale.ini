; Vale config for the docs platform prose gate (.github/workflows/docs-prose.yml).
; Style packages are not tracked - only built-in Vale rules plus the project
; vocabulary under docs-platform/vale/styles - so an upstream rule change can
; never fail an unrelated PR (playbook P5, W-3).

StylesPath = docs-platform/vale/styles
MinAlertLevel = warning

[*.mdx]
BasedOnStyles = Vale

[*.md]
BasedOnStyles = Vale
