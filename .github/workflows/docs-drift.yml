name: docs-drift

# Detects where docs platform pages and mirrored sources disagree with the
# artifacts they describe. Findings are posted as a PR comment and written to
# docs-platform/drift/findings.json (uploaded as an artifact for agents and
# consumed by the /docs/conflicts dashboard). Blocking findings
# (confidence: certain) fail the check once promoted; until then the job is
# advisory only - see the "Fail on blocking findings" step at the bottom.

on:
  pull_request:
    paths:
      - "content/**"
      - "docs-platform/**"
      - "lib/**"
      - "data/**"
      - ".github/CODEOWNERS"
  push:
    # `local` is the repo's default branch - merged PRs (incl. Keystatic
    # editor PRs) land there.
    branches: [main, local]
    paths:
      - "content/**"
      - "docs-platform/**"
      - "lib/**"
      - "data/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run fixture-corpus test
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test docs-platform/engine/check.test.ts

      - name: Run drift check
        id: drift
        run: node docs-platform/engine/check.ts --fail
        continue-on-error: true

      - name: Verify committed findings are current
        run: |
          git diff --exit-code -- docs-platform/drift/findings.json docs-platform/drift/report.md \
            || (echo "findings.json/report.md are stale - run 'npm run docs:drift' and commit the result" && exit 1)

      - name: Upload findings artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-findings
          path: |
            docs-platform/drift/findings.json
            docs-platform/drift/report.md
          if-no-files-found: ignore

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let body;
            try {
              body = fs.readFileSync("docs-platform/drift/report.md", "utf8");
            } catch {
              body = "Drift check ran but produced no report.";
            }
            const marker = "<!-- docs-drift-report -->";
            const full = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: full,
              });
            }

      # Advisory window: everything reports, nothing blocks. Flip this step to
      # `run: exit 1` once `certain`-confidence findings have been quiet on real
      # PRs - see the playbook's section 02.5.
      - name: Fail on blocking findings
        if: steps.drift.outcome == 'failure'
        run: echo "blocking findings present (advisory mode - not failing)" && exit 0
